apiVersion: aws.hops.ops.com.ai/v1alpha1
kind: SMTPSender
metadata:
  name: ops
  namespace: default
spec:
  domain: ops.com.ai
  clusterName: pat-local
  region: us-east-2
  managementPolicies:
    - "*"
  # Publish the three SES DKIM CNAMEs into Cloudflare directly from this XR.
  # Requires the Cloudflare DNS provider and a ProviderConfig installed on the
  # control plane (the Record CRD ships as an apiDependency of this package).
  cloudflare:
    providerConfigRef:
      name: cloudflare
      kind: ProviderConfig
    dkim:
      enabled: true
      zoneId: 90e2d946537b82c0723741dfc9203b39
