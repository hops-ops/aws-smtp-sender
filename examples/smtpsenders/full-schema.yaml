apiVersion: aws.hops.ops.com.ai/v1alpha1
kind: SMTPSender
metadata:
  name: ops
  namespace: default
spec:
  domain: ops.com.ai
  clusterName: pat-local
  region: us-east-2
  accountId: "034489662075"
  managementPolicies:
    - "*"
  labels:
    environment: dogfood
    team: platform
  tags:
    Environment: dogfood
    Team: platform
  providerConfigRef:
    name: default
    kind: ProviderConfig
  identity:
    dkimSigningKeyLength: RSA_2048_BIT
  iam:
    userName: ops-smtp
    permissionsBoundaryArn: arn:aws:iam::034489662075:policy/platform-boundary
  pushCredentials:
    enabled: true
    path: push/pat-local/ops-smtp
    tags:
      Purpose: outbound-mail
  dedicatedIpPool:
    enabled: false
    name: ops-smtp
    externalName: ops-smtp
    scalingMode: MANAGED
    tags:
      Purpose: outbound-mail
  configurationSet:
    name: ops-smtp
    externalName: ops-smtp
    deliveryOptions:
      tlsPolicy: REQUIRE
      maxDeliverySeconds: 50400
    reputationMetricsEnabled: true
    sendingEnabled: true
    suppressionReasons:
      - BOUNCE
      - COMPLAINT
    tags:
      Purpose: outbound-mail
  aws:
    tags:
      CostCenter: platform
  cloudflare:
    providerConfigRef:
      name: cloudflare
      kind: ProviderConfig
    dkim:
      enabled: true
      zoneId: 90e2d946537b82c0723741dfc9203b39
      ttl: 1
