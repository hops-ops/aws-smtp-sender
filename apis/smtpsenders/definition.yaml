apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: smtpsenders.aws.hops.ops.com.ai
spec:
  group: aws.hops.ops.com.ai
  names:
    categories:
      - crossplane
    kind: SMTPSender
    plural: smtpsenders
  scope: Namespaced
  versions:
    - name: v1alpha1
      referenceable: true
      served: true
      schema:
        openAPIV3Schema:
          type: object
          description: SMTPSender provisions an SES-backed outbound SMTP identity and publishes the SMTP password to AWS Secrets Manager.
          properties:
            spec:
              type: object
              description: SMTPSenderSpec defines the desired outbound mail identity.
              properties:
                domain:
                  type: string
                  description: Sender domain to verify with SES, for example ops.com.ai.
                region:
                  type: string
                  description: AWS region for SES, IAM, and Secrets Manager resources.
                  default: us-east-2
                accountId:
                  type: string
                  description: Optional AWS account ID used to narrow the SES send policy resource ARN. Defaults to wildcard account when omitted.
                clusterName:
                  type: string
                  description: Cluster or environment name used in default AWS Secrets Manager paths and tags.
                managementPolicies:
                  description: ManagementPolicies for AWS resources. Defaults to ["*"].
                  type: array
                  items:
                    type: string
                    enum:
                      - "*"
                      - Create
                      - Observe
                      - Update
                      - Delete
                      - LateInitialize
                  default:
                    - "*"
                labels:
                  type: object
                  description: Custom labels applied to all Kubernetes resources. Merged with default labels.
                  additionalProperties:
                    type: string
                  x-kubernetes-preserve-unknown-fields: true
                tags:
                  type: object
                  description: Custom tags applied to all AWS resources. Merged with default tags.
                  additionalProperties:
                    type: string
                  x-kubernetes-preserve-unknown-fields: true
                providerConfigRef:
                  type: object
                  description: Reference to the AWS ProviderConfig. Defaults to clusterName or "default".
                  properties:
                    name:
                      type: string
                      description: Name of the ProviderConfig.
                    kind:
                      type: string
                      description: Kind of the ProviderConfig. Defaults to ProviderConfig.
                      default: ProviderConfig
                awsProviderConfigRef:
                  type: object
                  description: Deprecated alias for providerConfigRef retained for the original draft spec shape.
                  properties:
                    name:
                      type: string
                    kind:
                      type: string
                      default: ProviderConfig
                identity:
                  type: object
                  description: SES identity configuration.
                  properties:
                    externalName:
                      type: string
                      description: External name for the SESv2 EmailIdentity. Defaults to spec.domain.
                    dkimSigningKeyLength:
                      type: string
                      description: Easy DKIM key length for the SES identity.
                      enum:
                        - RSA_1024_BIT
                        - RSA_2048_BIT
                      default: RSA_2048_BIT
                iam:
                  type: object
                  description: IAM SMTP credential configuration.
                  properties:
                    userName:
                      type: string
                      description: IAM user name for SES SMTP. Defaults to <xrName>-smtp.
                    userExternalName:
                      type: string
                      description: External name for importing an existing IAM user. Defaults to userName for new users.
                    policyExternalName:
                      type: string
                      description: External name for importing an existing IAM policy. Defaults to <userName>-send-email.
                    accessKeyExternalName:
                      type: string
                      description: External name for importing an existing IAM access key.
                    permissionsBoundaryArn:
                      type: string
                      description: ARN of the permissions boundary policy to apply to the IAM user.
                pushCredentials:
                  type: object
                  description: AWS Secrets Manager publication settings for the SES SMTP password.
                  properties:
                    enabled:
                      type: boolean
                      description: Whether to create the AWS Secrets Manager secret and version.
                      default: true
                    path:
                      type: string
                      description: AWS Secrets Manager secret name. Defaults to push/<clusterName>/<xrName>-smtp.
                    tags:
                      type: object
                      description: Additional tags applied only to the AWS Secrets Manager secret.
                      additionalProperties:
                        type: string
                      x-kubernetes-preserve-unknown-fields: true
                aws:
                  type: object
                  description: AWS-specific extension point.
                  properties:
                    tags:
                      type: object
                      description: Additional AWS tags merged with root tags.
                      additionalProperties:
                        type: string
                      x-kubernetes-preserve-unknown-fields: true
              required:
                - domain
                - clusterName
                - managementPolicies
            status:
              type: object
              description: SMTPSenderStatus exposes integration outputs for SMTP consumers and DKIM record publishers.
              properties:
                ready:
                  type: boolean
                  description: Whether all enabled composed resources are ready.
                smtp:
                  type: object
                  properties:
                    host:
                      type: string
                      description: SES SMTP endpoint.
                    port:
                      type: integer
                      description: SES SMTP STARTTLS port.
                    username:
                      type: string
                      description: SES SMTP username, equal to the IAM AccessKey ID.
                    awsSecretsManagerPath:
                      type: string
                      description: AWS Secrets Manager path containing the SES SMTP password.
                dkim:
                  type: object
                  properties:
                    verified:
                      type: boolean
                      description: Whether SES reports the identity as verified for sending.
                    verificationStatus:
                      type: string
                      description: SES identity verification status.
                    status:
                      type: string
                      description: SES DKIM verification status.
                    tokens:
                      type: array
                      description: DKIM tokens for DNS CNAME publication.
                      items:
                        type: string
                iam:
                  type: object
                  properties:
                    userArn:
                      type: string
                      description: ARN of the IAM SMTP user.
                    policyArn:
                      type: string
                      description: ARN of the IAM policy attached to the SMTP user.
                ses:
                  type: object
                  properties:
                    identityArn:
                      type: string
                      description: ARN of the SESv2 EmailIdentity.
                secret:
                  type: object
                  properties:
                    arn:
                      type: string
                      description: ARN of the AWS Secrets Manager secret when pushCredentials is enabled.
          required:
            - spec
